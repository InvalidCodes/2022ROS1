base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 5.0
planner_frequency: 1.0
planner_patience: 5.0
controller_patience: 10.0
clearing_rotation_allowed: true

NavfnROS:
  allow_unknown: true         # plan through space the SLAM map has not seen yet
  default_tolerance: 0.3

DWAPlannerROS:                # differential drive: no sideways motion
  max_vel_x: 0.5
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.5
  min_vel_trans: 0.05
  max_vel_theta: 2.0
  min_vel_theta: 0.3
  acc_lim_x: 1.5
  acc_lim_y: 0.0
  acc_lim_theta: 3.0
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 6.28    # the final heading does not matter
  latch_xy_goal_tolerance: true
  sim_time: 1.5
  vx_samples: 10
  vth_samples: 20
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  oscillation_reset_dist: 0.05
  prune_plan: true
